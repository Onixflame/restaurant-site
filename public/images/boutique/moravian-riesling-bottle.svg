<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
        <stop stop-color="#15120f"/>
        <stop offset="1" stop-color="#2d231c"/>
      </linearGradient>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
        <stop stop-color="#e4c28a"/>
        <stop offset="1" stop-color="#9f7444"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity="0.35"/>
      </filter>
    </defs>
    <rect width="1200" height="900" fill="url(#bg)"/>
    <circle cx="980" cy="140" r="220" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="200" cy="760" r="240" fill="#ffffff" fill-opacity="0.03"/>
    
    <ellipse cx="600" cy="690" rx="220" ry="34" fill="#000" fill-opacity="0.22"/>
    <g filter="url(#shadow)">
      <rect x="545" y="150" width="110" height="110" rx="24" fill="#2b241d"/>
      <rect x="520" y="240" width="160" height="440" rx="70" fill="#d9d5b5"/>
      <rect x="538" y="320" width="124" height="240" rx="26" fill="#f8f4ec"/>
      <rect x="520" y="380" width="160" height="250" rx="0" fill="#d4ca7d" fill-opacity="0.35"/>
      <text x="600" y="415" font-size="28" text-anchor="middle" fill="#8e673f" font-family="Arial, sans-serif">MORAVIAN</text>
      <text x="600" y="452" font-size="24" text-anchor="middle" fill="#8e673f" font-family="Georgia, serif">RIESLING</text>
    </g>
    <text x="82" y="96" font-size="26" letter-spacing="5" fill="#d4ad76" font-family="Arial, sans-serif">WINE CELLAR</text>
    
    </svg>